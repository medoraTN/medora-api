services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medora_test
      POSTGRES_USER: medora_test
      POSTGRES_PASSWORD: medora_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medora_test -d medora_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - medora-test-data:/var/lib/postgresql/data

volumes:
  medora-test-data:
